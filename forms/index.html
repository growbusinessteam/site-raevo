<script>
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        function setupRaevoMotion() {
            if (prefersReducedMotion) return;

            const hero = document.querySelector('body > section:first-of-type');
            if (hero) {
                hero.classList.add('hero-choreo');
                hero.querySelectorAll('.inline-flex, h1, p, .flex, .mt-9, .mt-7').forEach((element, index) => {
                    element.classList.add('hero-motion');
                    element.style.setProperty('--hero-delay', `${Math.min(index * 110, 760)}ms`);
                });
                hero.querySelectorAll('.mt-9 > div, .mt-7').forEach((element) => {
                    element.classList.add('hero-float');
                });
            }

            document.querySelectorAll('body > section, footer').forEach((section, index) => {
                if (section === hero) return;
                section.dataset.animate = 'section';
                section.style.setProperty('--reveal-delay', `${Math.min(index * 35, 180)}ms`);
            });

            document.querySelectorAll('section .grid, section .space-y-4, section .space-y-6, section .space-y-8, #faq-container, table tbody').forEach((group) => {
                const children = Array.from(group.children).filter((child) => child.tagName !== 'SCRIPT');
                children.forEach((child, index) => {
                    child.dataset.animateItem = 'true';
                    child.style.setProperty('--item-delay', `${Math.min(index * 85, 520)}ms`);
                });
            });

            const revealElements = Array.from(document.querySelectorAll('[data-animate]'));
            const revealItems = Array.from(document.querySelectorAll('[data-animate-item]'));
            const markVisibleChildren = (element) => {
                element.querySelectorAll('[data-animate-item]').forEach((child) => {
                    child.classList.add('is-visible-item');
                });
            };
            const isAlreadyInView = (element) => {
                const rect = element.getBoundingClientRect();
                return rect.top < window.innerHeight * 0.92 && rect.bottom > 0;
            };

            revealElements.forEach((element) => {
                if (isAlreadyInView(element)) {
                    element.classList.add('is-visible');
                    markVisibleChildren(element);
                }
            });
            revealItems.forEach((element) => {
                if (isAlreadyInView(element)) {
                    element.classList.add('is-visible-item');

                    if (entry.isIntersecting) {

                        markVisibleChildren(entry.target);
                        revealObserver.unobserve(entry.target);
                    }

        function splitPhoneValue(value) {
            const trimmedValue = String(value || '').trim();
            const matchedCountry = leadPhoneCountries.find((country) => trimmedValue.startsWith(country.code));
            if (!matchedCountry) {
                return { countryCode: '+351', localNumber: trimmedValue.replace(/\D/g, '') };
            }
            return {
                countryCode: matchedCountry.code,
                localNumber: trimmedValue.slice(matchedCountry.code.length).replace(/\D/g, '')
            };
        }

        function getLeadPhoneCountry(countryCode) {
            return leadPhoneCountries.find((country) => country.code === countryCode) || leadPhoneCountries[0];
        }

        function formatPhoneLocalNumber(countryCode, value) {
            const country = getLeadPhoneCountry(countryCode);
            const digits = String(value || '').replace(/\D/g, '');
            const parts = [];
            let cursor = 0;

            country.groups.forEach((groupSize) => {
                if (cursor >= digits.length) return;
                parts.push(digits.slice(cursor, cursor + groupSize));
                cursor += groupSize;
            });

            if (cursor < digits.length) {
                parts.push(digits.slice(cursor));
            }

            return parts.join(' ');
        }

        async function sendLeadPayload(payload) {
            const body = JSON.stringify(payload);
            const response = await fetch(raevoLeadFormWebhookUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=UTF-8',
                },
                body,
                keepalive: body.length < 60000,
            });

            if (!response.ok) {
                throw new Error(`Webhook returned ${response.status}`);
            }

            const responseText = await response.text();
            if (!responseText.trim()) {
                return { ok: true };
            }

            try {
                const result = JSON.parse(responseText);
                if (result && result.ok === false) {
                    throw new Error(result.error || 'Webhook response was not ok');
                }
                return result || { ok: true };
            } catch (error) {
                if (error instanceof SyntaxError) {
                    return { ok: true, raw: responseText };
                }
                throw error;
            }
        }

        function sendLeadPayloadFallback(payload) {
            const body = JSON.stringify(payload);
            const blob = new Blob([body], { type: 'text/plain;charset=UTF-8' });
            if (navigator.sendBeacon && navigator.sendBeacon(raevoLeadFormWebhookUrl, blob)) {
                return true;
            }

            fetch(raevoLeadFormWebhookUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'text/plain;charset=UTF-8',
                },
                body,
                keepalive: body.length < 60000,
            }).catch((error) => {
                console.warn('Raevo lead form no-cors fallback failed', error);
            });
            return true;
        }

        function retryPendingLeadPayloads() {
            getPendingLeadPayloads().forEach((payload) => {
                sendLeadPayload(payload)
                    .then(() => removePendingLeadPayload(payload.id))
                    .catch(() => sendLeadPayloadFallback(payload));
            });
        }

        async function submitLeadFormToKommo() {
            const values = {
                ...leadFormState.values,
                revenueRegion: leadFormState.values.revenueRegion || raevoLeadFormSteps
                    .find((step) => step.id === 'monthlyRevenue')
                    .regions[leadFormState.revenueRegion].label,
                pageUrl: window.location.href,
            };
            const payload = {
                id: `raevo-${Date.now()}-${Math.random().toString(36).slice(2)}`,
                values,
                contact: buildKommoContactPayload(values),
                source: 'raevo-site-conversational-form',
                submittedAt: new Date().toISOString(),
            };

            savePendingLeadPayload(payload);

            try {
                const result = await sendLeadPayload(payload);
                removePendingLeadPayload(payload.id);
                return result;
            } catch (error) {
                console.warn('Raevo lead form primary submission failed; continuing to thank-you page with fallback delivery.', error);
                sendLeadPayloadFallback(payload);
                return { ok: true, fallback: true };
            }
        }

        

        document.querySelectorAll('[data-close-lead-form]').forEach((trigger) => {
            trigger.addEventListener('click', closeLeadForm);
        });

        leadFormBack.addEventListener('click', () => {
            leadFormState.currentStep = Math.max(0, leadFormState.currentStep - 1);
            renderLeadFormStep();
        });

        leadFormNext.addEventListener('click', goToNextLeadFormStep);

        leadFormInner.addEventListener('submit', async (event) => {
            event.preventDefault();
            if (!validateLeadFormStep()) return;
            leadFormState.isSubmitting = true;
            renderLeadFormStep();
            try {
                await submitLeadFormToKommo();
            } catch (error) {
                console.warn('Raevo lead form submission failed after fallback; continuing to thank-you page.', error);
            }
            leadFormState.completed = true;
            leadFormState.isSubmitting = false;
            renderLeadFormStep();
            window.location.assign(raevoLeadFormBookingUrl);
        });

        window.addEventListener('load', retryPendingLeadPayloads);

        openLeadForm();

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && !leadForm.classList.contains('hidden')) {
                closeLeadForm();
            }
        });
    
</script>
</body></html>
